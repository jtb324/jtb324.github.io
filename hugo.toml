[params.about]
enable = true
title = "About Me"
content = "I am a PhD student in the Human Genetics Program at Vanderbilt University. My research focuses on how we can leverage distant relatedness in large biobanks linked to electronic health data to explore the genetic causes of disease. To investigate this, I design pipelines and software in (*mostly*) Python and R for both local HPC environments and the cloud environments to implement novel statistical methods or to efficiently scale existing methods to modern large biobanks (BioVU, All of Us, and UK Biobank). Additionally, I have an interest in how we can leverage modern high performance data science packages (such as Polars and DuckDB) and software best practices to design reliable, scalable, and maintainable research software."

